; PlatformIO Project Configuration File para Mascota ESP32-S3 (Valeria+ / VIA+)

[platformio]
default_envs = esp32s3_mascot_release

[env:esp32s3_mascot_release]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Especificación de arquitectura ESP32-S3 Dual Core + PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv

; Opciones de Compilación y Optimización
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -D MASCOT_FW_VERSION_MAJOR=1
    -D MASCOT_FW_VERSION_MINOR=0

; Dependencias de Librerías Oficiales
lib_deps = 
    h2zero/NimBLE-Arduino @ ^1.4.1
    fastled/FastLED @ ^3.6.0
    madhephaestus/ESP32Servo @ ^1.1.1
    bblanchon/ArduinoJson @ ^7.0.3

; Opciones de Carga e Inspección
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
